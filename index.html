<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header_title">Dashboard</div>
      <nav class="header_nav">
        <a href="#Home"  class="header_link">Home</a>
        <a  href="#About" class="header_link">Profile</a>
        <button class="logout_button">Logout</button>
      </nav>
    </header>

    <div class="dashboard">
      <ul class="dashboard_sidebar">
        <li class="list_items">Menu 1</li>
        <li class="list_items">Menu 2</li>
        <li class="list_items">Menu 3</li>
      </ul>

      <div class="dashboard_main">
        <div class="dashboard_cards">
          <div class="dashboard_card_users" id="users">Users</div>
          <div class="dashboard_card_orders">Orders</div>
          <div class="dashboard_card_Revenue">Revenue</div>
        </div>

        <div class="load_button_container">
          <button class="load_button" onclick="loadData()">Load Data</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
